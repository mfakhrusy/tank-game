services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  client:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
